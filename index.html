// "C-0531", "c0531", "0531" o "C 0531" se buscan como código; cualquier otra cosa como palabras
function normalizarCodigoError(consulta) {
    const m = consulta.toUpperCase().replace(/\s+/g, "").match(/^C?-?([0-9A-F]{4})(-\w+)?$/);
    if (!m || !/\d/.test(m[1])) return null;
    return `C-${m[1]}${m[2] || ""}`;
}

function filtroIlike(palabra) {
    return `"*${palabra.replace(/\\/g, "\\\\").replace(/"/g, '\\"')}*"`;
}

async function buscarCodigosError() {
    const consulta = document.getElementById("entrada-codigo").value.trim();
    const modelo = document.getElementById("combo-modelo-codigo").value;
    document.getElementById("lbl-cod-total").textContent = "";
    if (!consulta) {
        ultimaBusquedaCodigos = null;
        mostrarAvisoCodigos(t("cod_inicio"));
        return;
    }

    const params = new URLSearchParams();
    params.set("select", "modelo,codigo,clasificacion,causa,medidas_alerta,partes_sospechosas,correccion,solucion");
    params.set("order", "codigo.asc,modelo.asc");
    if (modelo) params.set("modelo", `eq.${modelo}`);

    const codigo = normalizarCodigoError(consulta);
    let palabras = [];
    if (codigo) {
        params.set("codigo", `ilike.${codigo}*`);
    } else {
        palabras = consulta.split(/\s+/).filter(Boolean).slice(0, 5);
        const grupos = palabras.map(p => `or(${CAMPOS_BUSQUEDA_CODIGOS.map(c => `${c}.ilike.${filtroIlike(p)}`).join(",")})`);
        params.set("and", `(${grupos.join(",")})`);
    }

    const id = ++busquedaCodigosId;
    mostrarAvisoCodigos(t("cod_buscando"));
    try {
        const resp = await fetch(`${SUPABASE_URL}/rest/v1/${SUPABASE_TABLA_CODIGOS}?${params}`, {
            headers: { apikey: SUPABASE_KEY, Range: `0-${LIMITE_CODIGOS - 1}`, Prefer: "count=exact" }
        });
        if (id !== busquedaCodigosId) return; // llegó una búsqueda más nueva
        if (!resp.ok && resp.status !== 416) throw new Error(`HTTP ${resp.status}`);
        const filas = resp.status === 416 ? [] : await resp.json();
        const rango = resp.headers.get("content-range") || "";
        const total = parseInt(rango.split("/")[1], 10) || filas.length;
        ultimaBusquedaCodigos = { consulta, palabras, filas, total };
        renderizarCodigos(ultimaBusquedaCodigos);
    } catch (err) {
        if (id !== busquedaCodigosId) return;
        console.warn("No se pudieron buscar códigos de error en Supabase:", err);
        ultimaBusquedaCodigos = null;
        mostrarAvisoCodigos(t("cod_sin_conexion"));
    }
}

function renderizarCodigos({ consulta, palabras, filas, total }) {
    const lblTotal = document.getElementById("lbl-cod-total");
    if (!filas.length) {
        lblTotal.textContent = "";
        mostrarAvisoCodigos(t("cod_sin_resultados").replace("{q}", consulta));
        return;
    }
    lblTotal.textContent = total > filas.length
        ? t("cod_total_parcial").replace("{n}", filas.length).replace("{total}", total)
        : t("cod_total").replace("{n}", total);

    document.getElementById("resultados-codigos").innerHTML = filas.map(f => {
        const campos = CAMPOS_TARJETA_CODIGO.map(([col, clave]) => {
            let valor = (f[col] || "").trim();
            if (col === "correccion") valor = valor.replace(/^Note\s*\n/i, "").trim();
            if (!valor) return "";
            return `<div class="codigo-campo">
                <div class="codigo-campo-lbl">${escaparHtml(t(clave))}</div>
                <div class="codigo-campo-txt">${resaltarPalabras(valor, palabras)}</div>
            </div>`;
        }).join("");
        return `<div class="codigo-card">
            <div class="codigo-card-head">
                <span class="codigo-badge">${resaltarPalabras(f.codigo, palabras)}</span>
                <span class="codigo-modelo">${escaparHtml(f.modelo)}</span>
                <span class="codigo-titulo">${resaltarPalabras(f.clasificacion || "", palabras)}</span>
            </div>${campos}
        </div>`;
    }).join("");
}

// ================= MANTENIMIENTO PERIÓDICO (MANUALES DE SERVICIO EN SUPABASE) =================
const SUPABASE_TABLA_MANT = "manual_mantenimiento";
const ACCIONES_MANT = ["Reemplazo", "Limpieza", "Lubricación", "Revisión"];
const CLASE_ACCION = { "Reemplazo": "reemplazo", "Limpieza": "limpieza", "Lubricación": "lubricacion", "Revisión": "revision" };
const COLUMNAS_MANT = ["mant_col_unidad", "mant_col_seccion", "mant_col_desc", "mant_col_parts", "mant_col_cant", "mant_col_intervalo", "mant_col_accion", "mant_col_obs"];
const mantPorModelo = {}; // modelo -> filas | "cargando" | "error"

async function cargarMantenimiento(modelo) {
    if (!modelo || Array.isArray(mantPorModelo[modelo]) || mantPorModelo[modelo] === "cargando") return;
    mantPorModelo[modelo] = "cargando";
    renderizarMantenimiento();
    try {
        const filas = [];
        for (let desde = 0; ; desde += SUPABASE_PAGINA) {
            const resp = await fetch(
                `${SUPABASE_URL}/rest/v1/${SUPABASE_TABLA_MANT}?select=unidad,tipo,intervalo,intervalo_unidad,seccion,descripcion,parts_no,cantidad,accion,observacion&modelo=eq.${encodeURIComponent(modelo)}&order=id.asc`,
                { headers: { apikey: SUPABASE_KEY, Range: `${desde}-${desde + SUPABASE_PAGINA - 1}` } }
            );
            if (!resp.ok && resp.status !== 416) throw new Error(`HTTP ${resp.status}`);
            const pagina = resp.status === 416 ? [] : await resp.json();
            filas.push(...pagina);
            if (pagina.length < SUPABASE_PAGINA) break;
        }
        mantPorModelo[modelo] = filas;
    } catch (err) {
        console.warn("No se pudo cargar el mantenimiento desde Supabase:", err);
        mantPorModelo[modelo] = "error";
    }
    if (document.getElementById("combo-modelo-mant").value === modelo) {
        llenarFiltrosMantenimiento();
        renderizarMantenimiento();
    }
}

function llenarFiltrosMantenimiento() {
    llenarComboModelos(document.getElementById("combo-modelo-mant"), null);
    const filas = mantPorModelo[document.getElementById("combo-modelo-mant").value];
    const unidades = Array.isArray(filas) ? [...new Set(filas.map(f => f.unidad).filter(Boolean))] : [];

    const llenar = (combo, opciones) => {
        const actual = combo.value;
        combo.innerHTML = "";
        [["", t("mant_todas")], ...opciones].forEach(([valor, texto]) => {
            const op = document.createElement("option");
            op.value = valor;
            op.textContent = texto;
            combo.appendChild(op);
        });
        combo.value = opciones.some(([valor]) => valor === actual) ? actual : "";
    };
    llenar(document.getElementById("combo-unidad-mant"), unidades.map(u => [u, u]));
    llenar(document.getElementById("combo-accion-mant"), ACCIONES_MANT.map(a => [a, t(`acc_${a}`)]));
}

function formatearIntervalo(fila) {
    if (fila.intervalo === null || fila.intervalo === undefined) return "—";
    const numero = Number(fila.intervalo).toLocaleString(idiomaActual === "en" ? "en-US" : "es-AR");
    const unidad = fila.intervalo_unidad === "counts" ? t("mant_counts") : (fila.intervalo_unidad || "");
    return `${numero} ${unidad}`.trim();
}

function renderizarMantenimiento() {
    const encabezado = document.getElementById("tabla-mant-headers");
    encabezado.innerHTML = COLUMNAS_MANT.map(c => `<th class="align-l">${escaparHtml(t(c))}</th>`).join("");
    const cuerpo = document.getElementById("tabla-mant-body");
    const aviso = document.getElementById("aviso-mant");
    const lblTotal = document.getElementById("lbl-mant-total");

    const modelo = document.getElementById("combo-modelo-mant").value;
    const filas = mantPorModelo[modelo];
    if (!Array.isArray(filas)) {
        cuerpo.innerHTML = "";
        lblTotal.textContent = "";
        aviso.textContent = filas === "error" ? t("mant_sin_conexion") : t("mant_cargando");
        return;
    }

    const unidad = document.getElementById("combo-unidad-mant").value;
    const accion = document.getElementById("combo-accion-mant").value;
    const palabras = document.getElementById("entrada-mant").value.toLowerCase().split(/\s+/).filter(Boolean);
    const visibles = filas.filter(f => {
        if (unidad && f.unidad !== unidad) return false;
        if (accion && !(f.accion || "").split(", ").includes(accion)) return false;
        const texto = [f.descripcion, f.parts_no, f.seccion, f.observacion, f.unidad].join(" ").toLowerCase();
        return palabras.every(p => texto.includes(p));
    });

    lblTotal.textContent = t("mant_total").replace("{n}", visibles.length);
    aviso.textContent = visibles.length ? "" : t("mant_sin_filas");
    cuerpo.innerHTML = visibles.map((f, i) => {
        const acciones = (f.accion || "").split(", ").filter(Boolean)
            .map(a => `<span class="accion-chip ${CLASE_ACCION[a] || ""}">${escaparHtml(t(`acc_${a}`))}</span>`).join(" ");
        const puntual = f.tipo === "Reemplazo puntual"
            ? `<div style="font-size:11px; color:var(--texto-gris);">${escaparHtml(t("mant_puntual"))}</div>` : "";
        return `<tr class="${i % 2 ? "impar" : "par"}">
            <td class="ajustar">${escaparHtml(f.unidad || "")}</td>
            <td class="ajustar">${escaparHtml(f.seccion || "")}</td>
            <td class="ajustar" style="font-weight:600;">${resaltarPalabras(f.descripcion || "", palabras)}</td>
            <td>${resaltarPalabras(f.parts_no || "", palabras)}${referenciaCatalogo(modelo, f.parts_no || partesEnTexto(f.descripcion))}</td>
            <td class="num">${f.cantidad ?? ""}</td>
            <td class="num" style="white-space:nowrap;">${escaparHtml(formatearIntervalo(f))}${puntual}</td>
            <td>${acciones}</td>
            <td class="obs">${escaparHtml(f.observacion || "")}</td>
        </tr>`;
    }).join("");
}

// ================= CATÁLOGO DE REPUESTOS POR EQUIPO (SUPABASE) =================
const CATALOGOS_REPUESTOS = { "AL400": "al400" }; // equipo -> tabla de Supabase con su catálogo
const LIMITE_FILAS_REPUESTOS = 500;
const COLUMNAS_REP = [
    ["Page", "rep_col_pagina", "num"], ["Key", "rep_col_key", "num"], ["Parts No.", "rep_col_parts", ""],
    ["Parts Name", "rep_col_nombre", "ajustar"], ["Class", "rep_col_clase", ""], ["Quantity", "rep_col_cant", "num"],
    ["Ship Unit", "rep_col_envio", "num"], ["Destinations", "rep_col_destinos", "ajustar"], ["PMN No.", "rep_col_pmn", ""]
];
const repuestosPorModelo = {}; // modelo -> filas | "cargando" | "error"
const referenciasCatalogo = {}; // "modelo|parts_no" -> filas del catálogo que coinciden

async function cargarRepuestos(modelo) {
    const tabla = CATALOGOS_REPUESTOS[modelo];
    if (!tabla || Array.isArray(repuestosPorModelo[modelo]) || repuestosPorModelo[modelo] === "cargando") return;
    repuestosPorModelo[modelo] = "cargando";
    renderizarRepuestos();
    try {
        const filas = [];
        for (let desde = 0; ; desde += SUPABASE_PAGINA) {
            const resp = await fetch(`${SUPABASE_URL}/rest/v1/${tabla}?select=*`, {
                headers: { apikey: SUPABASE_KEY, Range: `${desde}-${desde + SUPABASE_PAGINA - 1}` }
            });
            if (!resp.ok && resp.status !== 416) throw new Error(`HTTP ${resp.status}`);
            const pagina = resp.status === 416 ? [] : await resp.json();
            filas.push(...pagina);
            if (pagina.length < SUPABASE_PAGINA) break;
        }
        const numero = v => { const n = parseFloat(v); return isNaN(n) ? Infinity : n; };
        filas.sort((a, b) => numero(a.Page) - numero(b.Page) || numero(a.Key) - numero(b.Key));
        repuestosPorModelo[modelo] = filas;
    } catch (err) {
        console.warn("No se pudo cargar el catálogo de repuestos desde Supabase:", err);
        repuestosPorModelo[modelo] = "error";
    }
    if (document.getElementById("combo-modelo-rep").value === modelo) {
        llenarFiltrosRepuestos();
        renderizarRepuestos();
    }
    if (document.getElementById("combo-modelo-mant").value === modelo) renderizarMantenimiento();
}

function llenarFiltrosRepuestos() {
    const comboModelo = document.getElementById("combo-modelo-rep");
    const actual = comboModelo.value;
    comboModelo.innerHTML = "";
    Object.keys(CATALOGOS_REPUESTOS).forEach(m => {
        const op = document.createElement("option");
        op.value = m;
        op.textContent = m;
        comboModelo.appendChild(op);
    });
    if (actual in CATALOGOS_REPUESTOS) comboModelo.value = actual;

    const filas = repuestosPorModelo[comboModelo.value];
    const clases = Array.isArray(filas) ? [...new Set(filas.map(f => f.Class).filter(Boolean))].sort() : [];
    const comboClase = document.getElementById("combo-clase-rep");
    const claseActual = comboClase.value;
    comboClase.innerHTML = "";
    [["", t("mant_todas")], ...clases.map(c => [c, c])].forEach(([valor, texto]) => {
        const op = document.createElement("option");
        op.value = valor;
        op.textContent = texto;
        comboClase.appendChild(op);
    });
    comboClase.value = clases.includes(claseActual) ? claseActual : "";
}

function renderizarRepuestos() {
    document.getElementById("tabla-rep-headers").innerHTML =
        COLUMNAS_REP.map(([, clave]) => `<th class="align-l">${escaparHtml(t(clave))}</th>`).join("");
    const cuerpo = document.getElementById("tabla-rep-body");
    const aviso = document.getElementById("aviso-rep");
    const lblTotal = document.getElementById("lbl-rep-total");

    const filas = repuestosPorModelo[document.getElementById("combo-modelo-rep").value];
    if (!Array.isArray(filas)) {
        cuerpo.innerHTML = "";
        lblTotal.textContent = "";
        aviso.textContent = filas === "error" ? t("rep_sin_conexion") : t("rep_cargando");
        return;
    }

    const clase = document.getElementById("combo-clase-rep").value;
    const palabras = document.getElementById("entrada-rep").value.toLowerCase().split(/\s+/).filter(Boolean);
    const visibles = filas.filter(f => {
        if (clase && f.Class !== clase) return false;
        const texto = [f["Parts No."], f["Parts Name"], f["PMN No."], f.Destinations, `p${f.Page}`].join(" ").toLowerCase();
        return palabras.every(p => texto.includes(p));
    });

    lblTotal.textContent = visibles.length > LIMITE_FILAS_REPUESTOS
        ? t("rep_total_parcial").replace("{n}", LIMITE_FILAS_REPUESTOS).replace("{total}", visibles.length)
        : t("rep_total").replace("{n}", visibles.length);
    aviso.textContent = visibles.length ? "" : t("rep_sin_filas");
    cuerpo.innerHTML = visibles.slice(0, LIMITE_FILAS_REPUESTOS).map((f, i) =>
        `<tr class="${i % 2 ? "impar" : "par"}">${COLUMNAS_REP.map(([col, , css]) =>
            `<td class="${css}">${resaltarPalabras(f[col] ?? "", palabras)}</td>`).join("")}</tr>`
    ).join("");
}

// Busca en el catálogo del equipo los repuestos de un Parts No. del manual ("AC0CR744##/AC0CR783##" -> AC0CR744xx)
function buscarEnCatalogo(modelo, partsNo) {
    const catalogo = repuestosPorModelo[modelo];
    if (!Array.isArray(catalogo) || !partsNo) return [];
    const clave = `${modelo}|${partsNo}`;
    if (!(clave in referenciasCatalogo)) {
        const prefijos = partsNo.toUpperCase().split(/[\/,;\s]+/)
            .map(tok => tok.replace(/[#\-]/g, "")).filter(tok => tok.length >= 6);
        referenciasCatalogo[clave] = catalogo.filter(f => {
            const parte = String(f["Parts No."] || "").toUpperCase().replace(/\s+/g, "");
            return prefijos.some(p => parte.startsWith(p));
        });
    }
    return referenciasCatalogo[clave];
}

// Algunos manuales ponen el Parts No. dentro de la descripción ("Waste toner box AC0CR744##/AC0CR783##")
function partesEnTexto(texto) {
    return (String(texto || "").match(/\b(?=[A-Z0-9]*\d)(?=[A-Z0-9]*[A-Z])[A-Z0-9]{6,}#*/g) || []).join("/");
}

function referenciaCatalogo(modelo, partsNo) {
    const coincidencias = buscarEnCatalogo(modelo, partsNo);
    if (!coincidencias.length) return "";
    const f = coincidencias[0];
    let texto = t("rep_en_catalogo").replace("{nombre}", f["Parts Name"] || f["Parts No."])
        .replace("{pagina}", f.Page ?? "?").replace("{key}", f.Key ?? "?");
    if (coincidencias.length > 1) texto += ` (${t("rep_mas").replace("{n}", coincidencias.length - 1)})`;
    return `<div style="font-size:11px; color:var(--texto-gris); white-space:normal; min-width:160px;">${escaparHtml(texto)}</div>`;
}

// ================= BÚSQUEDA EN EL TEXTO COMPLETO DE LOS MANUALES (SUPABASE) =================
const SUPABASE_TABLA_PAGINAS = "manual_paginas";
const LIMITE_DOCS = 30;
let ultimaBusquedaDocs = null; // { consulta, palabras, filas, total }
let busquedaDocsId = 0;
const textoPaginaCache = {};

// Palabras a resaltar al abrir una página: sin comillas, sin las excluidas con "-" y sin las muy cortas
function palabrasDeConsulta(consulta) {
    return consulta.replace(/"/g, " ").split(/\s+/).filter(p => p && !p.startsWith("-") && p.toLowerCase() !== "or" && p.length >= 3);
}

async function buscarEnManuales() {
    const consulta = document.getElementById("entrada-docs").value.trim();
    const modelo = document.getElementById("combo-modelo-docs").value;
    document.getElementById("lbl-docs-total").textContent = "";
    if (!consulta) {
        ultimaBusquedaDocs = null;
        mostrarAviso("resultados-docs", t("docs_inicio"));
        return;
    }

    const id = ++busquedaDocsId;
    mostrarAviso("resultados-docs", t("docs_buscando"));
    try {
        const resp = await fetch(`${SUPABASE_URL}/rest/v1/rpc/buscar_manual`, {
            method: "POST",
            headers: { apikey: SUPABASE_KEY, "Content-Type": "application/json" },
            body: JSON.stringify({ consulta, equipo: modelo || null, limite: LIMITE_DOCS })
        });
        if (id !== busquedaDocsId) return; // llegó una búsqueda más nueva
        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        const filas = await resp.json();
        ultimaBusquedaDocs = { consulta, palabras: palabrasDeConsulta(consulta), filas, total: filas.length ? Number(filas[0].total) : 0 };
        renderizarDocs(ultimaBusquedaDocs);
    } catch (err) {
        if (id !== busquedaDocsId) return;
        console.warn("No se pudo buscar en los manuales de Supabase:", err);
        ultimaBusquedaDocs = null;
        mostrarAviso("resultados-docs", t("cod_sin_conexion"));
    }
}

function renderizarDocs({ consulta, filas, total }) {
    const lblTotal = document.getElementById("lbl-docs-total");
    if (!filas.length) {
        lblTotal.textContent = "";
        mostrarAviso("resultados-docs", t("docs_sin_resultados").replace("{q}", consulta));
        return;
    }
    lblTotal.textContent = total > filas.length
        ? t("docs_total_parcial").replace("{n}", filas.length).replace("{total}", total)
        : t("docs_total").replace("{n}", total);

    document.getElementById("resultados-docs").innerHTML = filas.map(f => {
        const fragmento = escaparHtml(f.fragmento || "").replace(/\[\[([\s\S]*?)\]\]/g, "<mark>$1</mark>");
        return `<div class="codigo-card">
            <div class="codigo-card-head">
                <span class="codigo-modelo">${escaparHtml(f.modelo)}</span>
                <span class="codigo-titulo">${escaparHtml(f.titulo || "")}</span>
            </div>
            <div class="doc-ruta">${escaparHtml(f.ruta || "")}</div>
            <div class="codigo-campo-txt">${fragmento}</div>
            <button class="btn btn-mini btn-ver-pagina" data-id="${Number(f.id)}">${escaparHtml(t("docs_ver"))}</button>
        </div>`;
    }).join("");
}

async function alternarPaginaCompleta(boton) {
    const tarjeta = boton.closest(".codigo-card");
    const abierta = tarjeta.querySelector(".doc-texto");
    if (abierta) {
        abierta.remove();
        boton.textContent = t("docs_ver");
        return;
    }
    const div = document.createElement("div");
    div.className = "doc-texto";
    div.textContent = t("docs_cargando_pagina");
    tarjeta.insertBefore(div, boton);
    boton.textContent = t("docs_ocultar");

    const id = boton.dataset.id;
    try {
        if (!(id in textoPaginaCache)) {
            const resp = await fetch(`${SUPABASE_URL}/rest/v1/${SUPABASE_TABLA_PAGINAS}?select=texto&id=eq.${id}`, {
                headers: { apikey: SUPABASE_KEY }
            });
            if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
            const filas = await resp.json();
            textoPaginaCache[id] = filas.length ? (filas[0].texto || "") : "";
        }
        div.innerHTML = resaltarPalabras(textoPaginaCache[id], ultimaBusquedaDocs ? ultimaBusquedaDocs.palabras : []);
    } catch (err) {
        console.warn("No se pudo cargar la página del manual:", err);
        div.textContent = t("cod_sin_conexion");
    }
}

async function cargarArballonSupabase() {
    mostrarProgreso(t("modal_supabase"), 0.05);
    try {
        const filas = [];
        for (let desde = 0; ; desde += SUPABASE_PAGINA) {
            const resp = await fetch(
                `${SUPABASE_URL}/rest/v1/${SUPABASE_TABLA_ARBALLON}?select=*&order=${encodeURIComponent('"Codigo Arballon"')}.asc`,
                { headers: { apikey: SUPABASE_KEY, Range: `${desde}-${desde + SUPABASE_PAGINA - 1}`, Prefer: "count=exact" } }
            );
            if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
            const pagina = await resp.json();
            filas.push(...pagina);

            // Content-Range: "0-999/4389" -> total de filas para la barra de progreso
            const total = parseInt((resp.headers.get("Content-Range") || "").split("/")[1]) || 0;
            if (total) mostrarProgreso(t("modal_supabase"), Math.min(filas.length / total, 1));
            if (pagina.length < SUPABASE_PAGINA || (total && filas.length >= total)) break;
        }
        if (!filas.length) throw new Error("tabla vacía");

        dfReferencia = filas;
        nombreExcelActual = t("supabase_ok");
        try {
            localStorage.setItem("km_excel_data", JSON.stringify(dfReferencia));
            localStorage.setItem("km_excel_nombre", nombreExcelActual);
        } catch (err) {}
    } catch (err) {
        console.warn("No se pudo cargar Arballon desde Supabase:", err);
        if (dfReferencia.length) nombreExcelActual = t("supabase_offline");
    }
    if (contenidoTxtActual) parsearSpecialPartsPuro(contenidoTxtActual);
    actualizarVista();
    ocultarProgreso();
}

// Inicializar aplicación
actualizarTextosIdioma();
cargarArballonSupabase();

// App instalable (PWA): Service Worker y botón "Instalar app"
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
    window.addEventListener("load", () => {
        navigator.serviceWorker.register("sw.js").catch(err => console.warn("Service Worker no registrado:", err));
    });
}

let eventoInstalacion = null;
const btnInstalar = document.getElementById("btn-instalar-app");
const yaInstalada = window.matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;

// El botón se muestra siempre en el navegador; dentro de la app instalada se oculta
btnInstalar.hidden = yaInstalada;

// Chrome / Edge avisan cuando la app se puede instalar directo desde el botón
window.addEventListener("beforeinstallprompt", (e) => {
    e.preventDefault();
    eventoInstalacion = e;
});

btnInstalar.addEventListener("click", async () => {
    if (eventoInstalacion) {
        eventoInstalacion.prompt();
        const { outcome } = await eventoInstalacion.userChoice;
        eventoInstalacion = null;
        if (outcome === "accepted") btnInstalar.hidden = true;
        return;
    }
    // Sin instalación directa disponible: mostrar los pasos según el navegador
    const ua = navigator.userAgent;
    let clave = "instalar_chrome";
    if (location.protocol === "file:") clave = "instalar_archivo";
    else if (/Edg\//.test(ua)) clave = "instalar_edge";
    else if (/Firefox\//.test(ua)) clave = "instalar_firefox";
    else if (/Safari\//.test(ua) && !/Chrome\/|Chromium\//.test(ua)) clave = "instalar_safari";
    document.getElementById("lbl-instalar-titulo").textContent = t("instalar_titulo");
    document.getElementById("lbl-instalar-pasos").textContent = t(clave);
    document.getElementById("btn-cerrar-instalar").textContent = t("entendido");
    document.getElementById("modal-instalar").classList.add("active");
});

document.getElementById("btn-cerrar-instalar").addEventListener("click", () => {
    document.getElementById("modal-instalar").classList.remove("active");
});

window.addEventListener("appinstalled", () => {
    eventoInstalacion = null;
    btnInstalar.hidden = true;
});
</script>
